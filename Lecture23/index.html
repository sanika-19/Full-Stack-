<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height:100vh;
            background-color: beige;
          border-radius: 3px;
            border: 3px solid black;
        }
        .box{

            width:350px;
            height: 80px;
           border: 2px solid black;
            background-color: blue;
            margin: 10px;
            border-radius: 3px;
            position: relative;
            animation-name: rightmovement;
            /* animation-duration: 5s; 
            animation-iteration-count: 1;
            animation-delay: 2s;
            animation-direction: alternate-reverse;
            animation-timing-function: cubic-bezier(0.25, 0.1, 0.25, 1); */
            /* animation-timing-function: ease-out; */
            /* animation-fill-mode: backwards; */
 animation: 5s linear infinite alternate none running rightmovement;
        }
        @keyframes rightmovement {
            from{
               top:0;
               left:0;
            }
            to{
                top:0;
                left:1200px
            }
        }
        #box2{
            width:350px;
            height: 80px;
           border: 2px solid black;
            background-color: blue;
            margin: 10px;
            border-radius: 3px;
            position: relative;
            animation-name: leftmovement;
            animation: 5s ease-in 1s infinite alternate none running leftmovement;
        }
        #circle{
            
        }

         @keyframes leftmovement {
            from{
               top:580px;
               left:1350px;
            }
            to{
                top:580px;
                left:0px
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
        <div id="box2"></div>
        <div id="circle"></div>
    </div>
</body>
</html>
