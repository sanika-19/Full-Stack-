<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Transform</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height:100%;
        }
        .container{
             background-color: antiquewhite;
             padding: 5rem;
             /* display: flex;*/
             gap: 1rem ;
             display: grid;
             grid-template-columns: repeat(3,1fr);
        }
        .items{
            padding:2rem;
            height:150px;
            width:150px;
            background-color: rgb(135, 203, 166);
            border: 2px solid black;
            color: white;
            font-weight: bold;
        }
        #rotatex:hover{
            transform: rotateX(60deg);
        }
        #rotatey:hover{
            transform: rotateY(45deg);
        }
        #rotatez:hover{
            transform: rotateZ(45deg);
        }
        #translatex:hover{
            transform: translateX(100px);
        }
         #translatey:hover{
            transform: translateY(100px);
        }
         #translatez:hover{
            transform:perspective(300px) translateZ(100px);
        }
        #scalex:hover{
            transform: scaleX(1.5);
        }

         #scaley:hover{
            transform: scaleY(1.5);
        }
         #scalez:hover{
            transform:perspective(300px) scalez(5) rotateZ(30deg) ;
        }
        #skewx:hover{
            transform: skewX(20deg);
        }

        #skewy:hover{
            transform: skewY(20deg);
        }
        #skewz:hover{
             transform:perspective(300px) skewz(20deg);
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="items" id="rotatex">Rotate X</div>
        <div class="items" id="rotatey">Rotate Y</div>
        <div class="items" id="rotatez">Rotate Z</div>
        <div class="items" id="translatex">Translate x</div>
        <div class="items" id="translatey">Translate Y</div>
        <div class="items" id="translatez">Translate z</div>
        <div class="items" id="scalex">Scale X</div>
        <div class="items" id="scaley">Scale Y</div>
        <div class="items" id="scalez">Scale Z</div>
        <div class="items" id="skewx">Skew X</div>
        <div class="items" id="skewy">skewx Y</div>
        <div class="items" id="skewz">Skew Z</div>
    </div>
</body>
</html>
