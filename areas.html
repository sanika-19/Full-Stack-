<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template Areas</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
        }
        .container{
            display: grid;
            gap: 1rem;
            background-color: rgb(184, 174, 174);
            padding: 4rem;;
            grid-template-areas:
            "header header header" 
            "sidebar content-1 content-1"
            "sidebar content-2 content-3"
            "footer footer footer";
            /* grid-template-columns: repeat(auto-fit,minmax(200px,400px)); */
        }
        .item{
            background-color: rgb(167, 167, 255);
            border: 2px solid black;
            padding: 1rem;
            color: white;
        }
        #header{
          grid-area: header;
        }
        #sidebar{
          grid-area: sidebar;
        }
        #content-1{
          grid-area: content-1;
        }
        #content-2{
          grid-area: content-2;
        }
        #content-3{
          grid-area: content-3;
        }
        #footer{
          grid-area: footer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="header">Header</div>
        <div class="item" id="sidebar">SideBar</div>
        <div class="item" id="content-1">Content-1</div>
        <div class="item" id="content-2">Content-2</div>
         <div class="item" id="content-3">Content-3</div>
        <div class="item" id="footer">Footer</div>
        <!-- <div class="item">G</div> 
        <div class="item">H</div>
         <div class="item">I</div>
        <div class="item">J</div>
        <div class="item">K</div>
        <div class="item">L</div> -->
    </div>
</body>
</html>
