<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Form</title>
</head>
<body>
    
    <form action="">
        <fieldset>
             <h2>Complex form</h2>
            <legend>Personal Information</legend>
           
        <label for="nm">Name:</label>
        <input type="text" name="nm" id="nm"><br><br>

          <label for="email">Email:</label>
        <input type="text" name="email" id="email"><br><br>

          <label for="phone">Phone:</label>
        <input type="tel" name="phone" id="phone"><br><br>
         <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob"><br><br>
         Gender: <br>
         <input type="radio" name="type" id="type">
         <label for="type">male</label><br>
          <input type="radio" name="type" id="type1">
         <label for="type1">Female</label><br><br>
         <label for="con"> Country</label>
        <select name="con" id="con">
            <option value="high">India</option>
            <option value="Batch">USA</option>
            <option value="bt">Dubai</option>
            <option value="mt">UAE</option>
        </select>
        <br><br>
        </fieldset><br>
        <fieldset>
            <legend>Address</legend>
            <label for="nm"> Street:</label>

        <input type="text" name="nm" id="nm"><br><br>

          <label for="City">City:</label>
        <input type="City" name="City" id="City"><br><br>

          <label for="State">State:</label>
        <input type="text" name="State" id="State"><br><br>
        <label for="cd">Zip Code:</label>
        <input type="text" name="cd" id="cd">
        
        </fieldset> <br> 
        <fieldset>
            <legend>Other Information</legend>
              <label for="tx">Comments:</label><br>
             <textarea name="tx" id="tx" cols="30" rows="10"></textarea><br>
             <label for="ch1">I agree to the terms of sevice</label>
             <input type="checkbox" name="ch1" id="ch1"> <br>
             <input type="submit" name="sb" id="sb" value="Submit">
        </fieldset>
    </form>
</body>
</html>
