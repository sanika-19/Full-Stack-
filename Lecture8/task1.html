<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Inputs</title>
  </head>
  <body>
    <form>
        <fieldset style="width: 32%; border-radius: 5px;">
            <legend>Form controls</legend>
      <label for="tx">TextField:</label>
      <input type="text" name="tx" id="tx" /><br />
      <br />
      <label for="tx">Radio Button:</label>
      Male
      <input type="radio" name="gender" id="male" />
      Female
      <input type="radio" name="gender" id="female" />
      Other
      <input type="radio" name="gender" id="other" /><br /><br>
      <label for="food">Choice:</label>
      <select name="food" id="food">
        <option value="kurkure">kurkure</option>
        <option value="pizza">Pizza</option>
        <option value="Burger">Burger</option>
        <option value="Tako">Tako</option>
      </select><br><br>
      <label for="ch1">Checkbox:</label><br>
      <input type="checkbox" id="ch1"/>Marathi<br>
      <input type="checkbox" id="ch2" />Hindi<br>
      <input type="checkbox" id="ch3"  />English<br><br>
      <label for="dt">Date Peaker:</label>
      <input type="date" name="dt" id="dt"><br><br>
      <label for="file">File:</label>
      <input type="file" name="file" id="file"><br><br>
      <label for="btn">Button:</label>
      <input type="submit" value="Submit" id="btn">
      </fieldset>
    </form>

  </body>
</html>
