<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Example</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3,1fr);
            border: 2px solid black;

        }
        .items{
            border: 1px solid red;
            height: 100px;
            width: 100%;
        }
        .first{
            grid-column-start: 0;
            grid-column-end: 3;
        }
    </style>
</head>
<body>
    <div class="container">
      <div class="items first"></div>
      <div class="items"></div>
      <div class="items"></div>
      <div class="items"></div>
      <div class="items"></div>
      <div class="items"></div>
      <div class="items"></div>
      <div class="items"></div>
      
    </div>
</body>
</html>
