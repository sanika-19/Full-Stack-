<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            display: flex;
            background-color: beige;
            border: 5px black solid;
            flex-direction: row;
            padding: 2px;
            margin: 2px;
            height: 1200px;
            align-items: start;
            flex-wrap: wrap;
           justify-content:start;
            align-items: start;
            align-content: start;
        }
        .box{
            width: 200px;
            height: 200px;
            margin: 2px;
            padding: 2px;
            border: 2px solid brown;
            
        }
        #box1{ background-color: aqua;
        order:500;}
        #box2{ background-color: navy;}
        #box3{ background-color: orange;}
        #box4{ background-color:brown; order: -1;}
    </style>
</head>

<body>
    
    <div class="container">
        <div class="box" id="box1">Box1</div>
        <div class="box"  id="box2">Box2</div>
        <div class="box"  id="box3">Box3</div>
        <div class="box" id="box4">Box4</div>
    </div>
</body>
</html>
