<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards Project</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box ;
        }
      .container {
        width: 100vw;
        height: 100vh;
        min-height: 700px;
        background: #74ebd5; /* fallback for old browsers */
        background: -webkit-linear-gradient(
          to right,
          #acb6e5,
          #74ebd5
        ); /* Chrome 10-25, Safari 5.1-6 */
        background: linear-gradient(
          to right,
          #acb6e5,
          #74ebd5
        ); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
        display: flex;
        justify-content: center;
        align-items: center;

      }
      .card{
        width:300px;
        height: 450px;
        background: white;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
      }
      .card img{
        width: 100%;
        height: 55%;
       border-radius: 10px;
        
      }
      .card h3{
        font-weight: bold;
        font-size: 1rem;
      }
      .card p{
        font-size: 0.9em;
      }
      
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="img1.jpg" alt="img">
        <h3>A volcano is a natural opening in the Earth that releases lava, ash, and gases.</h3>
        <p>A volcano is a natural opening in the Earth that releases lava, ash, and gases, forming mountains and shaping landscapes through powerful eruptions over time across the planet continually evolving.</p>
      </div>
    </div>
  </body>
</html>
