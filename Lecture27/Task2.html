<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Demo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f4;
    }

    .container {
      width: 50%;
      height: 350px;
      /* border-radius: 10px; */
      overflow: hidden;
      display: flex;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .leftbox {
      width: 50%;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      justify-content: center;
      background-color: rgb(68, 6, 68);
      color: white;
    }

    .leftbox h2 {
      font-size: 22px;
    }

    #para {
      font-size: 14px;
      line-height: 1.6;
      color: #e6dbe6;
    }

    #box {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .s1 {
      text-align: center;
    }

    .s1 h2 {
      font-size: 20px;
    }

    .s1 p {
      font-size: 13px;
      color: #d9c6d9;
    }

    .rightbox {
      width: 50%;
    }

    .rightbox {
  width: 50%;
  height: 100%;
  background-image: url("img1.jpg");
  background-size: cover;        /* fills the box */
  background-position: center;   /* centers image */
  background-repeat: no-repeat;
}

  </style>
</head>

<body>

  <div class="container">

    <div class="leftbox">
      <h2>Lorem ipsum dolor sit, amet consectetur adipisicing.</h2>

      <div id="para">
        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Quaerat placeat quas perspiciatis nisi necessitatibus,
        reiciendis esse temporibus vero id aliquam.
      </div>

      <div id="box">
        <div class="s1">
          <h2>10K+</h2>
          <p>Comments</p>
        </div>

        <div class="s1">
          <h2>214</h2>
          <p>Paid Users</p>
        </div>

        <div class="s1">
          <h2>12M+</h2>
          <p>Views</p>
        </div>
      </div>
    </div>

    <div class="rightbox">
      <img src="img1.jpg" alt="Card Image">
    </div>

  </div>

</body>
</html>
