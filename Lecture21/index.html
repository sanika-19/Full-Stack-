<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media  Query</title>
    <style>
    .box{
        width: 200px;
        height: 200px;
        background-color: orange;
        border: 2px solid black;
    }
    @media( min-width:300px) and (max-width:500px){
        .box{
            background-color: aqua;
            width: 200px;
            height: 200px;
        }
    }
    </style>

</head>
<body>
<div class="box">
    hello world
</div>


</body>
</html>
