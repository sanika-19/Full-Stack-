<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            background-color: beige;;
            border: 2px solid black;
            border-radius: 5px;
            padding: 2px;
            flex-direction: row;
        }
        .box{
            width: 200px;
            height: 200px;
            margin: 2px;
            padding: 2px;
            border-radius: 3px;
            /* background-color: orchid; */
        }
         #box1{
            
            background-color: rgb(21, 77, 65);
        }
         #box2{
            
            background-color: rgb(148, 124, 147);
        }
         #box3{
            
            background-color: rgb(210, 106, 132);
        }
         #box4{
            
            background-color: rgb(69, 6, 66);
        }
        @media(min-width:680px){
            .container{
                flex-direction: row;
                /* align-items: center; */
            }
        }
         @media(max-width:680px){
            .container{
                flex-direction: column;
                /* align-items: center; */
            }
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box" id="box1">
Box1
    </div>
    <div class="box" id="box2">Box2</div>
    <div class="box" id="box3">Box3</div>
    <div class="box" id="box4">Box4</div>
</div>
</body>
</html>
