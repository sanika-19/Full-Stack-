<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in Html</title>
</head>
<body>
    <h1 style="align-items: center; font-family: 'Courier New', Courier, monospace;">Html Table</h1>
     <table border="1">
        
            <thead><th>Student id</th>
            <th>Student Name</th>
            <th>Gender</th>
            <th>Age</th></thead>
            
        <tbody>
       <tr>
        <td>1234</td>
        <td colspan="3">Bill</td>
       
       </tr>
       <tr>
        <td>1235</td>
        <td>John</td>
        <td>Male</td>
        <td rowspan="3">50</td>
        
       </tr>
       <tr>
        <td>1236</td>
        <td>olivia</td>
        <td>Female</td>
        
       </tr>
       <tr>
        <td>1237</td>
        <td>Mia</td>
        <td>Female</td>
       
       </tr>
       </tbody>
     </table>

</body>
</html>
